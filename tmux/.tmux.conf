# ~/.tmux.conf — sensible defaults (tmux 3.x, macOS)

# ---- Prefix --------------------------------------------------------------
# Default prefix is C-b. To use C-a instead, uncomment these three lines:
# unbind C-b
# set -g prefix C-a
# bind C-a send-prefix

# ---- General -------------------------------------------------------------
set -g mouse on                     # click to select panes, drag to resize, scroll
set -g history-limit 50000          # big scrollback
set -sg escape-time 10              # no lag on Esc (important for vim/neovim)
set -g focus-events on              # let editors know when they gain/lose focus
set -g base-index 1                 # windows start at 1 (matches keyboard)
setw -g pane-base-index 1           # panes start at 1
set -g renumber-windows on          # no gaps after closing a window
set -g display-time 2000            # messages stay visible a bit longer
set -g set-clipboard on             # OSC 52 clipboard passthrough

# True color + proper terminal
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,*256col*:RGB,xterm-ghostty:RGB"

# ---- Keybindings ---------------------------------------------------------
# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# Split panes with | and -, keeping the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation and resizing
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Ctrl+h/j/k/l (no prefix) move between tmux panes and Neovim windows as one
# grid (vim-tmux-navigator). In a Neovim pane the keys are passed through.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R
# C-l is taken above, so prefix + C-l clears the screen. Switch windows with prefix n/p.
bind C-l send-keys C-l

# ---- Copy mode (vi keys, copy to macOS clipboard) ------------------------
setw -g mode-keys vi
# PageUp (fn+↑ on a Mac keyboard) scrolls back without the prefix. Full-screen
# apps (Neovim, less, htop) get the key as usual. Scrolling back to the bottom
# leaves copy mode.
bind -n PageUp if -F "#{alternate_on}" "send-keys PageUp" "copy-mode -eu"
bind v copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# ---- Look ----------------------------------------------------------------
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=colour235,fg=colour250"
set -g status-left-length 30
set -g status-left "#[fg=colour235,bg=colour110,bold] #S #[default] "
set -g status-right "#[fg=colour245]%Y-%m-%d %H:%M #[fg=colour235,bg=colour110,bold] #h "
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=colour235,bg=colour180,bold] #I:#W#{?window_zoomed_flag, 🔍,} "
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour110"
set -g message-style "bg=colour110,fg=colour235"
setw -g monitor-activity on
set -g visual-activity off
